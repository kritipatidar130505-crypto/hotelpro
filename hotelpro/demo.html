<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelPro | Luxury Hotel Management & Booking Solution</title>
  
  <!-- Fonts & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- React 18 & Babel for standalone JSX execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary-navy: #0d1b2a;
      --primary-dark: #1b263b;
      --accent-gold: #c5a059;
      --accent-gold-hover: #b38e47;
      --cream-bg: #f8f9fa;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--cream-bg);
      color: #2b2d42;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    h1, h2, h3, .serif-heading {
      font-family: var(--font-serif);
      letter-spacing: -0.02em;
    }

    .luxury-navbar {
      background-color: var(--primary-navy);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .luxury-brand {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff !important;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .luxury-brand span {
      color: var(--accent-gold);
    }

    .btn-gold {
      background-color: var(--accent-gold);
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .btn-gold:hover, .btn-gold:focus {
      background-color: var(--accent-gold-hover);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(197, 160, 89, 0.35);
    }

    .btn-outline-gold {
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      background: transparent;
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .btn-outline-gold:hover {
      background-color: var(--accent-gold);
      color: #ffffff;
    }

    .hero-banner {
      background: linear-gradient(180deg, rgba(13, 27, 42, 0.78) 0%, rgba(13, 27, 42, 0.92) 100%),
                  url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      color: #ffffff;
      padding: 5rem 0 6.5rem;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.85);
      max-width: 650px;
    }

    .search-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      margin-top: -3.5rem;
      position: relative;
      z-index: 10;
      padding: 1.75rem;
    }

    .room-card {
      border: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: all 0.35s ease;
      background: #ffffff;
    }

    .room-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.14);
    }

    .room-card-img {
      height: 240px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .room-card:hover .room-card-img {
      transform: scale(1.04);
    }

    .room-price-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(13, 27, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .amenity-chip {
      background: #f1f4f8;
      color: #415a77;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .badge-available { background-color: #2ec4b6; color: #fff; }
    .badge-occupied { background-color: #e63946; color: #fff; }
    .badge-cleaning { background-color: #f4a261; color: #fff; }

    .stat-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      border-left: 4px solid var(--accent-gold);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-navy);
    }

    .modal-luxury-header {
      background: var(--primary-navy);
      color: #ffffff;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .voucher-card {
      background: #ffffff;
      border: 2px dashed #c5a059;
      border-radius: 12px;
      padding: 2rem;
      position: relative;
    }

    .voucher-card::before, .voucher-card::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: #f8f9fa;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
    }
    .voucher-card::before { left: -14px; }
    .voucher-card::after { right: -14px; }

    .luxury-footer {
      background: var(--primary-navy);
      color: #a0aec0;
      padding: 3.5rem 0 1.5rem;
      margin-top: 5rem;
    }

    .luxury-footer h5 {
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .luxury-footer a {
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.2s;
    }

    .luxury-footer a:hover {
      color: var(--accent-gold);
    }

    .eval-banner {
      background: #111e2e;
      color: #fff;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialRoomsData = [

        amenities: ['Lush Garden Patio', 'Rain Shower', 'Organic Toiletries', 'Smart 55" 4K TV', 'Silent Mini Fridge'],
        description: 'A serene sanctuary surrounded by tropical flora. Perfect for couples seeking peaceful rejuvenation with direct garden terrace access.',
        images: ['https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=1200&q=80'],
        status: 'Available',

      {
        _id: 'rm_412',
        roomNumber: '412',
        title: 'Luxury Family Penthouse',

        maxGuests: 6,
        bedType: '2 King Beds + 2 Twin Beds',
        sizeSqFt: 1100,
        amenities: ['2 Separate Bedrooms', 'Spacious Living & Dining Room', 'Kids Play Zone', 'Full Kitchen', 'Washer & Dryer'],
        description: 'A lavish home away from home for families. Features two private master suites, expansive communal parlor, and customized family concierge.',
        images: ['https://images.unsplash.com/photo-1578683010236-d716f9a3f461?auto=format&fit=crop&w=1200&q=80'],

      },
      {
        _id: 'rm_215',
        roomNumber: '215',
        title: 'Boutique Courtyard King',
        type: 'Deluxe',
        pricePerNight: 230,
        maxGuests: 2,
        bedType: '1 King Bed',
        sizeSqFt: 460,
        amenities: ['Courtyard Fountain View', 'Plush Bathrobes', 'Coffee Bar', 'Acoustic Soundproofing', 'Fast Wi-Fi'],
        description: 'Warm artisan aesthetics combined with modern comforts. Overlooks our classical courtyard with gentle fountain acoustics.',
        images: ['https://images.unsplash.com/photo-1591088398332-8a7791972843?auto=format&fit=crop&w=1200&q=80'],

        rating: 4.85,
      },
    ];

    const initialBookingsData = [
      {
        _id: 'bkg_1001',
        bookingReference: 'HP-948210',
        guestName: 'Eleanor Vance',
        guestEmail: 'eleanor.v@luxuryliving.com',
        guestPhone: '+1 (555) 234-5678',
        roomDetails: initialRoomsData[2],
        checkInDate: '2026-11-02',
        checkOutDate: '2026-11-05',
        nights: 3,
        guestsCount: 2,
        totalAmount: 2805,
        paymentStatus: 'Paid',
        paymentMethod: 'Visa ending in 4242',
        transactionId: 'TXN-98471924',
        bookingStatus: 'Confirmed',
        specialRequests: 'High floor, complimentary champagne on arrival.',
      },
      {
        _id: 'bkg_1002',
        bookingReference: 'HP-812394',
        guestName: 'Marcus Sterling',
        guestEmail: 'guest@hotelpro.com',
        guestPhone: '+1 (555) 876-5432',
        roomDetails: initialRoomsData[1],
        checkInDate: '2026-10-28',
        checkOutDate: '2026-10-30',
        nights: 2,
        guestsCount: 1,
        totalAmount: 924,
        paymentStatus: 'Paid',
        paymentMethod: 'Mastercard ending in 8812',
        transactionId: 'TXN-47291039',
        bookingStatus: 'Checked-In',
        specialRequests: 'Quiet room away from elevators, late check-out at 1 PM.',
      },
    ];

    function App() {
      const [role, setRole] = useState('guest'); // 'guest' or 'admin'
      const [activeTab, setActiveTab] = useState('explore'); // 'explore', 'my-bookings', 'admin'
      
      // Rooms and Bookings with LocalStorage persistence
      const [rooms, setRooms] = useState(() => {
        try {
          const saved = localStorage.getItem('hp_demo_rooms');
          return saved ? JSON.parse(saved) : initialRoomsData;
        } catch(e) { return initialRoomsData; }
      });

      const [bookings, setBookings] = useState(() => {
        try {
          const saved = localStorage.getItem('hp_demo_bookings');
          return saved ? JSON.parse(saved) : initialBookingsData;
        } catch(e) { return initialBookingsData; }
      });

      useEffect(() => {
        localStorage.setItem('hp_demo_rooms', JSON.stringify(rooms));
      }, [rooms]);

      useEffect(() => {
        localStorage.setItem('hp_demo_bookings', JSON.stringify(bookings));
      }, [bookings]);

      // Filters
      const [checkIn, setCheckIn] = useState('2026-10-29');
      const [checkOut, setCheckOut] = useState('2026-10-31');
      const [roomType, setRoomType] = useState('All');
      const [guests, setGuests] = useState(2);
      const [maxPrice, setMaxPrice] = useState(900);
      const [searchQuery, setSearchQuery] = useState('');

      // Modals
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [activeVoucher, setActiveVoucher] = useState(null);

      // Admin Add Room form
      const [showAddRoom, setShowAddRoom] = useState(false);
      const [newRoomNumber, setNewRoomNumber] = useState('');
      const [newRoomTitle, setNewRoomTitle] = useState('');
      const [newRoomType, setNewRoomType] = useState('Deluxe');
      const [newRoomPrice, setNewRoomPrice] = useState(250);
      const [newRoomGuests, setNewRoomGuests] = useState(2);
      const [newRoomDesc, setNewRoomDesc] = useState('');

      // Room filtering
      const filteredRooms = rooms.filter(r => {
        if (roomType !== 'All' && r.type !== roomType) return false;
        if (r.pricePerNight > maxPrice) return false;
        if (r.maxGuests < guests) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = r.title.toLowerCase().includes(q);
          const matchDesc = r.description.toLowerCase().includes(q);
          const matchAmenity = (r.amenities || []).some(a => a.toLowerCase().includes(q));
          if (!matchTitle && !matchDesc && !matchAmenity) return false;
        }
        return true;
      });

      // Booking creation
      const handleCreateBooking = (bookingData) => {
        const newBooking = {
          _id: 'bkg_' + Date.now(),
          bookingReference: 'HP-' + Math.floor(100000 + Math.random() * 900000),
          ...bookingData,
          paymentStatus: 'Paid',
          transactionId: 'TXN-' + Math.floor(10000000 + Math.random() * 90000000),
          bookingStatus: 'Confirmed',
          createdAt: new Date().toISOString()
        };

        setBookings([newBooking, ...bookings]);
        setSelectedRoom(null);
        setActiveVoucher(newBooking);
      };

      // Status updates
      const handleUpdateBookingStatus = (id, newStatus) => {
        setBookings(bookings.map(b => b._id === id ? { ...b, bookingStatus: newStatus } : b));
      };

      const handleUpdateRoomStatus = (id, newStatus) => {
        setRooms(rooms.map(r => r._id === id ? { ...r, status: newStatus } : r));
      };

      const handleAddRoomSubmit = (e) => {
        e.preventDefault();
        const created = {
          _id: 'rm_' + Date.now(),
          roomNumber: newRoomNumber,
          title: newRoomTitle,
          type: newRoomType,
          pricePerNight: Number(newRoomPrice),
          maxGuests: Number(newRoomGuests),
          bedType: '1 King Bed',
          sizeSqFt: 500,
          description: newRoomDesc || 'Newly refurbished luxury accommodation with full hotel amenities.',
          amenities: ['High-Speed Wi-Fi', 'Smart TV', 'Climate Control', 'Room Service', 'Espresso Bar'],
          images: ['https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1200&q=80'],
          status: 'Available',
          rating: 4.9
        };
        setRooms([created, ...rooms]);
        setShowAddRoom(false);
        setNewRoomNumber('');
        setNewRoomTitle('');
      };

      // KPI metrics
      const totalRevenue = bookings.filter(b => b.bookingStatus !== 'Cancelled').reduce((sum, b) => sum + (b.totalAmount || 0), 0);
      const occupiedRooms = rooms.filter(r => r.status === 'Occupied').length;
      const occupancyRate = Math.round((occupiedRooms / rooms.length) * 100) || 50;

      return (
        <div>
          {/* Top Mentor Review Banner */}
          <div className="eval-banner d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
              <span className="badge bg-warning text-dark me-2">Mentor Review Mode</span>
              <span>HotelPro: 6 Epics & 19 Tasks Implemented • React + Node/Express + MongoDB Architecture</span>
            </div>
            <div className="d-flex align-items-center gap-2">
              <span className="small text-white-50">Switch View:</span>
              <button 
                className={`btn btn-xs btn-sm ${role === 'guest' ? 'btn-warning text-dark fw-bold' : 'btn-outline-light'}`}
                onClick={() => { setRole('guest'); setActiveTab('explore'); }}
              >
                Guest View
              </button>
              <button 
                className={`btn btn-xs btn-sm ${role === 'admin' ? 'btn-warning text-dark fw-bold' : 'btn-outline-light'}`}
                onClick={() => { setRole('admin'); setActiveTab('admin'); }}
              >
                Staff / Admin View
              </button>
            </div>
          </div>

          {/* Navigation Bar */}
          <nav className="navbar navbar-expand-lg navbar-dark luxury-navbar sticky-top py-3">
            <div className="container">
              <a className="navbar-brand luxury-brand d-flex align-items-center" href="#top" onClick={() => setActiveTab('explore')}>
                <i className="bi bi-buildings-fill me-2 text-warning"></i>
                HOTEL<span>PRO</span>
              </a>

              <div className="d-flex align-items-center gap-3">
                <button 
                  className={`btn btn-link text-decoration-none ${activeTab === 'explore' ? 'text-warning fw-bold' : 'text-white'}`}
                  onClick={() => setActiveTab('explore')}
                >
                  <i className="bi bi-compass me-1"></i> Explore Suites
                </button>
                <button 
                  className={`btn btn-link text-decoration-none ${activeTab === 'my-bookings' ? 'text-warning fw-bold' : 'text-white'}`}
                  onClick={() => setActiveTab('my-bookings')}
                >
                  <i className="bi bi-calendar-check me-1"></i> My Bookings ({bookings.length})
                </button>
                {role === 'admin' && (
                  <button 
                    className={`btn btn-link text-decoration-none ${activeTab === 'admin' ? 'text-warning fw-bold' : 'text-white'}`}
                    onClick={() => setActiveTab('admin')}
                  >
                    <i className="bi bi-speedometer2 me-1"></i> Staff Console
                  </button>
                )}
              </div>
            </div>
          </nav>

          {/* TAB 1: EXPLORE SUITES */}
          {activeTab === 'explore' && (
            <div>
              <div className="hero-banner text-center">
                <div className="container">
                  <span className="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold text-uppercase mb-3">
                    ★ Modern Five-Star Hospitality
                  </span>
                  <h1 className="hero-title mb-3">Seamless Comfort & Luxury</h1>
                  <p className="hero-subtitle mx-auto mb-4">
                    Streamlined reservations, real-time availability tracking, luxury accommodations, and secure operations with HotelPro.
                  </p>
                  <div className="d-flex justify-content-center gap-3">
                    <button className="btn btn-gold btn-lg" onClick={() => {
                      document.getElementById('suites-catalog').scrollIntoView({ behavior: 'smooth' });
                    }}>
                      <i className="bi bi-search me-2"></i> Browse Suites
                    </button>
                    <button className="btn btn-outline-light btn-lg" onClick={() => setActiveTab('my-bookings')}>
                      <i className="bi bi-ticket-perforated me-2"></i> View Stays
                    </button>
                  </div>
                </div>
              </div>

              {/* Search & Filter Bar */}
              <div className="container">
                <div className="search-card">
                  <div className="row g-3 align-items-end">
                    <div className="col-lg-3 col-md-6">
                      <label className="form-label small fw-bold text-muted mb-1">
                        <i className="bi bi-calendar-event me-1 text-primary"></i> Check-in Date
                      </label>
                      <input 
                        type="date" 
                        className="form-control" 
                        value={checkIn} 
                        onChange={(e) => setCheckIn(e.target.value)} 
                      />
                    </div>

                    <div className="col-lg-3 col-md-6">
                      <label className="form-label small fw-bold text-muted mb-1">
                        <i className="bi bi-calendar-check me-1 text-primary"></i> Check-out Date
                      </label>
                      <input 
                        type="date" 
                        className="form-control" 
                        value={checkOut} 
                        onChange={(e) => setCheckOut(e.target.value)} 
                      />
                    </div>

                    <div className="col-lg-2 col-md-4">
                      <label className="form-label small fw-bold text-muted mb-1">
                        <i className="bi bi-door-open me-1 text-primary"></i> Suite Category
                      </label>
                      <select 
                        className="form-select" 
                        value={roomType} 
                        onChange={(e) => setRoomType(e.target.value)}
                      >
                        <option value="All">All Categories</option>
                        <option value="Deluxe">Deluxe Suites</option>
                        <option value="Executive Suite">Executive Suites</option>
                        <option value="Presidential Villa">Presidential Villa</option>
                        <option value="Superior King">Superior King</option>
                        <option value="Family Penthouse">Family Penthouse</option>
                      </select>
                    </div>

                    <div className="col-lg-2 col-md-4">
                      <label className="form-label small fw-bold text-muted mb-1">
                        <i className="bi bi-people me-1 text-primary"></i> Guests
                      </label>
                      <select 
                        className="form-select" 
                        value={guests} 
                        onChange={(e) => setGuests(Number(e.target.value))}
                      >
                        <option value={1}>1 Guest</option>
                        <option value={2}>2 Guests</option>
                        <option value={3}>3 Guests</option>
                        <option value={4}>4+ Guests</option>
                      </select>
                    </div>

                    <div className="col-lg-2 col-md-4">
                      <label className="form-label small fw-bold text-muted mb-1">
                        <i className="bi bi-cash-stack me-1 text-primary"></i> Max ${maxPrice}/nt
                      </label>
                      <input 
                        type="range" 
                        className="form-range" 
                        min="150" 
                        max="1000" 
                        step="50" 
                        value={maxPrice} 
                        onChange={(e) => setMaxPrice(Number(e.target.value))} 
                      />
                    </div>
                  </div>

                  <div className="mt-3 pt-3 border-top d-flex gap-2">

      const [guestPhone, setGuestPhone] = useState('+1 (555) 789-0123');
      const [inDate, setInDate] = useState(checkIn);
      const [outDate, setOutDate] = useState(checkOut);
      const [specialReq, setSpecialReq] = useState('');
      const [loading, setLoading] = useState(false);

      const nights = Math.max(1, Math.ceil((new Date(outDate) - new Date(inDate)) / (1000 * 60 * 60 * 24)));
      const subtotal = room.pricePerNight * nights;
      const tax = Math.round(subtotal * 0.1);
      const total = subtotal + tax;

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          onSubmit({
            roomDetails: room,
            guestName,
            guestEmail,
            guestPhone,
            checkInDate: inDate,
            checkOutDate: outDate,
            nights,
            guestsCount: room.maxGuests,
            totalAmount: total,
            specialRequests: specialReq || 'None',
            paymentMethod: 'Visa ending in 4242'
          });
          setLoading(false);
        }, 600);
      };

      return (
        <div className="modal show d-block" tabIndex="-1" style={{ backgroundColor: 'rgba(0,0,0,0.65)' }}>
          <div className="modal-dialog modal-lg modal-dialog-centered">
            <div className="modal-content overflow-hidden">

                  <small className="text-white-50">Room #{room.roomNumber} • ${room.pricePerNight} per night</small>
                </div>
                <button type="button" className="btn-close btn-close-white" onClick={onClose}></button>
              </div>

              <form onSubmit={handleFormSubmit}>
                <div className="modal-body p-4">
                  <div className="row g-4">
                    <div className="col-md-7 border-end-md">
                      <h6 className="fw-bold text-dark mb-3">
                        <i className="bi bi-person-circle me-2 text-primary"></i> Guest Information
                      </h6>

                      <div className="mb-3">
                        <label className="form-label small fw-semibold">Primary Guest Name</label>
                        <input 
                          type="text" 
                          className="form-control" 
                          required 
                          value={guestName} 
                          onChange={(e) => setGuestName(e.target.value)} 
                        />
                      </div>

                      <div className="row g-2 mb-3">
                        <div className="col-sm-6">
                          <label className="form-label small fw-semibold">Email Address</label>
                          <input 
                            type="email" 
                            className="form-control" 
                            required 
                            value={guestEmail} 
                            onChange={(e) => setGuestEmail(e.target.value)} 
                          />
                        </div>
                        <div className="col-sm-6">
                          <label className="form-label small fw-semibold">Phone</label>
                          <input 
                            type="text" 
                            className="form-control" 
                            required 
                            value={guestPhone} 
                            onChange={(e) => setGuestPhone(e.target.value)} 
                          />
                        </div>
                      </div>

                      <div className="row g-2 mb-3">
                        <div className="col-sm-6">
                          <label className="form-label small fw-semibold">Check-in</label>
                          <input 
                            type="date" 
                            className="form-control" 
                            required 
                            value={inDate} 
                            onChange={(e) => setInDate(e.target.value)} 
                          />
                        </div>
                        <div className="col-sm-6">
                          <label className="form-label small fw-semibold">Check-out</label>
                          <input 
                            type="date" 
                            className="form-control" 
                            required 
                            value={outDate} 
                            onChange={(e) => setOutDate(e.target.value)} 
                          />
                        </div>
                      </div>

                      <div className="mb-3">
                        <label className="form-label small fw-semibold">Special Requests (Optional)</label>
                        <textarea 
                          className="form-control" 
                          rows="2" 
                          placeholder="e.g. Quiet floor, extra pillows..." 
                          value={specialReq} 
                          onChange={(e) => setSpecialReq(e.target.value)}
                        ></textarea>
                      </div>

                      <h6 className="fw-bold text-dark mb-2 mt-4">
                        <i className="bi bi-credit-card-2-front me-2 text-primary"></i> Payment Details (Simulated)
                      </h6>
                      <div className="input-group mb-2">
                        <span className="input-group-text bg-light"><i className="bi bi-credit-card"></i></span>
                        <input type="text" className="form-control font-monospace" readOnly value="4242 •••• •••• 4242" />
                        <span className="input-group-text text-success bg-light"><i className="bi bi-shield-check me-1"></i> 256-bit Encrypted</span>
                      </div>
                    </div>

                    <div className="col-md-5">
                      <div className="p-3 bg-light rounded-3 h-100 d-flex flex-column justify-content-between">
                        <div>
                          <h6 className="fw-bold text-dark mb-3">Reservation Summary</h6>
                          <img 
                            src={room.images[0]} 
                            alt={room.title} 
                            className="w-100 rounded mb-3" 
                            style={{ height: '120px', objectFit: 'cover' }} 
                          />

                          <div className="d-flex justify-content-between text-muted small mb-2">
                            <span>Duration:</span>
                            <span className="fw-bold text-dark">{nights} night(s)</span>
                          </div>
                          <div className="d-flex justify-content-between text-muted small mb-2">
                            <span>Nightly Rate:</span>
                            <span>${room.pricePerNight}</span>
                          </div>
                          <div className="d-flex justify-content-between text-muted small mb-2">
                            <span>Room Subtotal:</span>
                            <span>${subtotal}</span>
                          </div>
                          <div className="d-flex justify-content-between text-muted small mb-2">
                            <span>Taxes & Fees (10%):</span>
                            <span>${tax}</span>
                          </div>
                          <hr />
                          <div className="d-flex justify-content-between align-items-center mb-2">
                            <span className="fw-bold text-dark">Total:</span>
                            <span className="h4 fw-bold text-primary mb-0">${total}</span>
                          </div>
                        </div>

                        <div className="mt-3">
                          <button 
                            type="submit" 
                            className="btn btn-gold w-100 py-2"
                            disabled={loading}
                          >
                            {loading ? 'Processing...' : `Confirm & Pay $${total}`}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function VoucherModal({ booking, onClose }) {
      return (
        <div className="modal show d-block" tabIndex="-1" style={{ backgroundColor: 'rgba(0,0,0,0.7)' }}>
          <div className="modal-dialog modal-md modal-dialog-centered">
            <div className="modal-content overflow-hidden">
              <div className="modal-header bg-dark text-white p-3">
                <h5 className="modal-title serif-heading mb-0">
                  <i className="bi bi-receipt me-2 text-warning"></i> Reservation Voucher & Receipt
                </h5>
                <button type="button" className="btn-close btn-close-white" onClick={onClose}></button>
              </div>

              <div className="modal-body p-4">
                <div className="voucher-card text-center mb-3">
                  <span className="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill fw-bold mb-2">
                    ✓ Booking Confirmed & Paid
                  </span>
                  <h3 className="serif-heading mb-1">{booking.roomDetails ? booking.roomDetails.title : 'Luxury Suite'}</h3>
                  <p className="text-muted small mb-3">
                    Reference Code: <strong className="font-monospace text-primary fs-6">{booking.bookingReference}</strong>
                  </p>

                  <div className="text-start bg-light p-3 rounded mb-3 small">
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Primary Guest:</div>
                      <div className="col-7 fw-semibold text-dark">{booking.guestName}</div>
                    </div>
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Check-in:</div>
                      <div className="col-7 fw-semibold text-dark">{booking.checkInDate} (From 3:00 PM)</div>
                    </div>
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Check-out:</div>
                      <div className="col-7 fw-semibold text-dark">{booking.checkOutDate} (Until 11:00 AM)</div>
                    </div>
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Duration:</div>
                      <div className="col-7 fw-semibold text-dark">{booking.nights} Night(s)</div>
                    </div>
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Payment:</div>
                      <div className="col-7 text-dark">{booking.paymentMethod}</div>
                    </div>
                    <div className="row mb-1">
                      <div className="col-5 text-muted">Transaction ID:</div>
                      <div className="col-7 font-monospace text-muted">{booking.transactionId}</div>
                    </div>
                    <hr className="my-2" />
                    <div className="row">
                      <div className="col-5 fw-bold text-dark">Total Paid:</div>
                      <div className="col-7 fw-bold text-success fs-6">${booking.totalAmount} USD</div>
                    </div>
                  </div>

                  <div className="p-3 border rounded bg-white d-inline-block shadow-sm">
                    <i className="bi bi-qr-code text-dark" style={{ fontSize: '4rem' }}></i>
                    <div className="text-muted" style={{ fontSize: '0.7rem' }}>Scan at Front Desk for Instant Check-in</div>
                  </div>
                </div>

                <div className="d-flex gap-2">
                  <button className="btn btn-outline-dark w-100" onClick={() => window.print()}>
                    <i className="bi bi-printer me-2"></i> Print Voucher
                  </button>
                  <button className="btn btn-gold w-100" onClick={onClose}>
                    Done
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
